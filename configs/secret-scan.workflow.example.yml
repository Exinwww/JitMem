# Optional: copy to .github/workflows/secret-scan.yml after granting your
# GitHub login permission to update workflows. This template is not active.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          TASK_SCANNER_ARCHIVE="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${TASK_SCANNER_ARCHIVE}"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "${TASK_SCANNER_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${TASK_SCANNER_ARCHIVE}" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan all Git history
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks" git . \
            --config=.gitleaks.toml --log-opts='--all --full-history' \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
