# Paper storage ablation: retain every raw trajectory with its executor judge label.
# Model endpoint, model name and key are supplied through environment variables.
# Copy to storage_all.local.toml and set data_root before evaluating.
[environment]
backend = "alfworld"
data_root = "/path/to/alfworld"
split = "valid_seen"
task_types = [1, 2, 3, 4, 5, 6]

[experiment]
method = "jitmem"
seeds = [0, 1, 2]
batch_size = 10
workers = 10
max_steps = 30
history_window = 3
retrieval_k = 3
store_policy = "all"
task_adaptive = true
output_dir = "outputs/storage_all"

[executor]
temperature = 1.0
omit_temperature = false
max_tokens = 4096
timeout_seconds = 90.0
retries = 3
token_limit_parameter = "max_tokens"

[curator]
temperature = 1.0
omit_temperature = false
max_tokens = 8192
timeout_seconds = 90.0
retries = 3
token_limit_parameter = "max_tokens"
