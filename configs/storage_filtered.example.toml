# Paper storage ablation: retain only executor-judge-positive raw trajectories.
# Model endpoint, model name and key are supplied through environment variables.
# Copy to storage_filtered.local.toml and set data_root before evaluating.
[environment]
backend = "alfworld"
data_root = "/path/to/alfworld"
split = "valid_seen"
task_types = [1, 2, 3, 4, 5, 6]

[experiment]
method = "jitmem"
prompt_profile = "paper-v1"
prompt_assets = "outputs/paper_prompts/v1"
seeds = [0, 1, 2]
batch_size = 10
workers = 10
max_steps = 30
history_window = 3
retrieval_k = 3
store_policy = "judge"
task_adaptive = true
output_dir = "outputs/storage_filtered_paper_v1"

[executor]
temperature = 1.0
omit_temperature = false
max_tokens = 4096
timeout_seconds = 90.0
retries = 3
token_limit_parameter = "max_tokens"

[curator]
temperature = 1.0
omit_temperature = false
max_tokens = 8192
timeout_seconds = 90.0
retries = 3
token_limit_parameter = "max_tokens"
