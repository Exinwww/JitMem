[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jitmem-reproduction"
version = "0.1.0"
description = "API-based, training-free Just-in-Time Memory reproduction on ALFWorld"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
alfworld = ["alfworld==0.4.2", "textworld[pddl]==1.6.2"]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
jitmem = "jitmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
